
<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            background-color: #34495e;
            color: white;
            padding: 20px;
        }

        .book {
            background-color: white;
            margin: 20px auto;
            padding: 15px;
            width: 350px;
            border-radius: 10px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Online Book Store</h1>

    <div class="book">
        <h2>Python Programming</h2>
        <p>Author: John Smith</p>
        <p>Price: Rs. 450</p>
        <p>Availability: Available</p>
        <button>Buy Now</button>
    </div>

    <div class="book">
        <h2>Java Programming</h2>
        <p>Author: James Gosling</p>
        <p>Price: Rs. 550</p>
        <p>Availability: Available</p>
        <button>Buy Now</button>
    </div>

    <div class="book">
        <h2>Data Science</h2>
        <p>Author: Wes McKinney</p>
        <p>Price: Rs. 600</p>
        <p>Availability: Out of Stock</p>
        <button>View Details</button>
    </div>

</body>
</html>
